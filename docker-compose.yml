# Тестова MySQL для характеризаційних тестів backend (ADR-005).
# Окрема від робочої БД: порт 3307, база kendr_test. Схему застосовує globalSetup тестів
# з db/schema.sql, тому тут лише сервер.
#
#   docker compose up -d      запустити (дочекайтеся статусу healthy: docker compose ps)
#   docker compose down -v    зупинити й видалити дані
services:
  mysql-test:
    image: mysql:8.0
    container_name: kendr-mysql-test
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: kendr_test
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pkendr_test --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
